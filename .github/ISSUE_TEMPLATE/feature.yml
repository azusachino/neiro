name: Feature request
description: Something neiro should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why the current commands do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: A proposal
      description: Optional. Check the roadmap's "not planned" list first.
